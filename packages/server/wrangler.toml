name = "atbolo"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# Persist invocation logs (exceptions + console output) so they're queryable in
# the dashboard, not just visible during a live `wrangler tail`.
[observability]
enabled = true
head_sampling_rate = 1

# The game loop runs on alarm-driven ticking inside the DO: each alarm() fire
# is a separate invocation with its own CPU budget, so CPU can't accumulate
# across ticks. The default 30s CPU budget (which applies even on Workers Paid
# unless overridden) is sufficient per-tick, but raising it to the 5-minute
# maximum provides headroom for expensive ticks (NPC repathing, persistence).
# Account is on Workers Standard (paid), required for this setting (Free
# rejects with 100328).
[limits]
cpu_ms = 300000

# The whole world lives in a single Durable Object instance ("world").
# At O(tens) of concurrent players a single DO at 10Hz is comfortable.
[durable_objects]
bindings = [{ name = "GAME", class_name = "GameDO" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameDO"]

[assets]
directory = "../client/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Without this, SPA fallback serves index.html for browser navigations to
# /oauth/* and /api/* BEFORE the Worker runs — so OAuth redirects never fire.
# Run the Worker first for dynamic routes; everything else serves as a static
# asset (the Worker still falls through to env.ASSETS.fetch for the SPA shell).
run_worker_first = ["/oauth/*", "/api/*", "/ws"]

[vars]
# Set to "1" to allow /api/login/dev (no atproto round-trip) for local play.
DEV_AUTH = "0"
# Honeycomb dataset for balance telemetry (shot outcomes, kills/TTK).
HONEYCOMB_DATASET = "atbolo-sim"

# KV namespace for cached Bluesky social data (profiles, relationships).
# Create with: wrangler kv namespace create SOCIAL_CACHE
# (then paste the returned id below for production; preview_id for local dev)
[[kv_namespaces]]
binding = "SOCIAL_CACHE"
id = "b673bce241ea456a80db14110ea15c46"

# Secrets (set with `wrangler secret put`):
#   SESSION_SECRET - HMAC key for session tokens. Required in production.
#   HONEYCOMB_API_KEY - ingest key for balance telemetry. Optional; telemetry
#                       is a no-op without it.
