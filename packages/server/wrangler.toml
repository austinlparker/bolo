name = "atbolo"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# Persist invocation logs (exceptions + console output) so they're queryable in
# the dashboard, not just visible during a live `wrangler tail`.
[observability]
enabled = true
head_sampling_rate = 1

# The game loop runs on setInterval inside the DO, so CPU accrues against a
# single invocation context instead of resetting per-request. The default
# 30s CPU budget (which applies even on Workers Paid unless overridden) caused
# the DO to be hard-reset, dropping every live socket roughly hourly.
# Per-tick work is kept cheap (see sim/npc.ts pathfinding); raising the budget
# to the 5-minute maximum eliminates the resets entirely. Account is on Workers
# Standard (paid), which is required for this setting (Free rejects with 100328).
[limits]
cpu_ms = 300000

# The whole world lives in a single Durable Object instance ("world").
# At O(tens) of concurrent players a single DO at 10Hz is comfortable.
[durable_objects]
bindings = [{ name = "GAME", class_name = "GameDO" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameDO"]

[assets]
directory = "../client/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Without this, SPA fallback serves index.html for browser navigations to
# /oauth/* and /api/* BEFORE the Worker runs — so OAuth redirects never fire.
# Run the Worker first for dynamic routes; everything else serves as a static
# asset (the Worker still falls through to env.ASSETS.fetch for the SPA shell).
run_worker_first = ["/oauth/*", "/api/*", "/ws"]

[vars]
# Set to "1" to allow /api/login/dev (no atproto round-trip) for local play.
DEV_AUTH = "0"
# Honeycomb dataset for balance telemetry (shot outcomes, kills/TTK).
HONEYCOMB_DATASET = "atbolo-sim"

# Secrets (set with `wrangler secret put`):
#   SESSION_SECRET - HMAC key for session tokens. Required in production.
#   HONEYCOMB_API_KEY - ingest key for balance telemetry. Optional; telemetry
#                       is a no-op without it.
